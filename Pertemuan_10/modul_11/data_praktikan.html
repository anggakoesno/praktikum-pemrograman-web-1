<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Data Praktikan</title>

    <!-- Panggil Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<body class="p-5">
    <div id="konten"></div>

    <script>
        // Konfirmasi apakah pengguna adalah praktikan PPW1
        var isPraktikan = confirm("Apakah anda praktikan PPW1?");

        if (isPraktikan) { // Jika ya, minta input data praktikan
            var nama = prompt("Nama Anda:", "");
            var nim = prompt("NIM Anda:", "");
            var angkatan = prompt("Angkatan:", "");

            // Tampilkan dalam tabel Bootstrap
            var tabel = `
                <table class="table table-bordered table-striped">
                    <thead class="table-success">
                        <tr>
                            <th>Nama</th>
                            <th>NIM</th>
                            <th>Angkatan</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr>
                            <td>${nama}</td>
                            <td>${nim}</td>
                            <td>${angkatan}</td>
                        </tr>
                    </tbody>
                </table>`;
            document.getElementById("konten").innerHTML = tabel;
        } else {
            // Jika tidak, tampilkan pesan peringatan
            document.getElementById("konten").innerHTML = "<h3 class='text-danger'>Anda bukan praktikan PPW1, anda tidak boleh masuk!</h3>";
        }
    </script>
</body>
</html>
